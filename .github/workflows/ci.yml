name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: ubuntu-latest
            rust: "1.85.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Doctests
        run: cargo test --locked --doc
      - name: Independent transcript vectors
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: python3 scripts/check_vectors.py
      - name: Documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Schnorr example
        run: cargo run --locked --example schnorr_example
      - name: Pedersen example
        run: cargo run --locked --example pedersen_example
      - name: Ring example
        run: cargo run --locked --example ring_example
      - name: Package
        run: cargo package --locked
